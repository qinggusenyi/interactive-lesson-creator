<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>互动课件</title><style>/*__STYLE__*/</style></head><body>
<header class="top"><button class="brand" id="home"><b>文</b><span id="brand-title"></span></button><nav><button id="home-nav">首页</button><button id="map-nav">探索地图</button><button id="teacher" aria-pressed="false">教师模式：关</button><button id="fullscreen">全屏</button></nav></header>
<section id="cover" class="screen active"><div class="cover-photo" id="cover-photo"></div><div class="cover-copy"><p class="kicker" id="grade"></p><div class="rule"></div><h1 id="title"></h1><p class="cover-goal" id="goal"></p><button class="primary" id="begin">开始探索　→</button><p class="cover-disclaimer">文学情境插画 · 非历史原貌</p></div></section>
<section id="map" class="screen"><div class="map-inner"><p class="kicker">EXPLORE THE TEXT</p><h2>循着文字，走进场景</h2><p class="map-task" id="task"></p><div id="map-cards" class="map-cards"></div><p class="map-foot">先观察，再用原文解释；图片提供想象线索，不充当文本证据。</p></div></section>
<section id="viewer" class="screen"><div id="stage" tabindex="0" role="group" aria-label="全景观察区，拖动或方向键转向"><canvas id="panorama"></canvas><div class="shade"></div><div id="points"></div></div><div class="viewer-heading"><p class="kicker" id="scene-index"></p><h2 id="scene-title"></h2><p id="scene-note"></p></div><span class="scene-type" id="scene-type">文学情境 · 水平 360°</span><aside id="detail" class="detail" hidden><button id="close-detail" class="close" aria-label="关闭详情">×</button><p class="kicker" id="spot-index"></p><h2 id="spot-title"></h2><img id="spot-art" alt=""><button id="reveal-art" hidden></button><p id="reveal-caption" hidden></p><blockquote id="quote"></blockquote><small id="source"></small><div class="detail-field"><small>观察提示 / 教学解读</small><p id="analysis"></p></div><div class="detail-field"><small>留给学生的问题</small><p id="question"></p></div><button id="reveal">显示解读</button></aside><div class="viewer-bottom"><div class="control-row"><button id="back-map">◈ 地图</button><button id="reset-view">⟲ 复位</button><button id="next">下一处观察 →</button><button id="toggle-points">隐藏热点</button></div><span id="status" role="status">拖动环视 · 滚轮缩放 · 点击热点</span></div><div id="fallback" hidden><h2>静态阅读</h2><p>当前设备不能渲染环视。请使用下面的文字入口打开观察点。</p><img id="fallback-image" alt=""><div id="fallback-links"></div></div></section>
<script type="application/json" id="lesson-data">__LESSON_JSON__</script><script>/*__RUNTIME__*/</script></body></html>
